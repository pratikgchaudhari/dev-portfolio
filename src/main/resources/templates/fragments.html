<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script src="/theme.js"></script>
    <title th:text="${seo.title}"></title>
    <meta name="description" th:content="${seo.description}">
    <meta name="author" th:content="${name}">
    <meta name="robots" th:content="${seo.robots}">
    <link th:if="${seo.canonicalUrl != null}" rel="canonical" th:href="${seo.canonicalUrl}">
    <meta property="og:type" th:content="${seo.type}">
    <meta property="og:site_name" th:content="${name}">
    <meta property="og:title" th:content="${seo.title}">
    <meta property="og:description" th:content="${seo.description}">
    <meta th:if="${seo.canonicalUrl != null}" property="og:url" th:content="${seo.canonicalUrl}">
    <meta th:if="${seo.imageUrl != null}" property="og:image" th:content="${seo.imageUrl}">
    <meta th:if="${seo.imageUrl != null}" property="og:image:width" content="1200">
    <meta th:if="${seo.imageUrl != null}" property="og:image:height" content="630">
    <meta th:if="${seo.imageUrl != null}" property="og:image:type" content="image/png">
    <meta th:if="${seo.imageUrl != null}" property="og:image:alt" th:content="${name + ' — Building software. Sharing what I learn.'}">
    <meta name="twitter:card" th:content="${seo.imageUrl != null ? 'summary_large_image' : 'summary'}">
    <meta name="twitter:creator" content="@pratikc_89">
    <meta name="twitter:title" th:content="${seo.title}">
    <meta name="twitter:description" th:content="${seo.description}">
    <meta th:if="${seo.imageUrl != null}" name="twitter:image" th:content="${seo.imageUrl}">
    <meta th:if="${seo.imageUrl != null}" name="twitter:image:alt" th:content="${name + ' — Building software. Sharing what I learn.'}">
    <meta th:if="${seo.published != null}" property="article:published_time" th:content="${seo.published}">
    <meta th:if="${seo.published != null and seo.authorUrl != null}" property="article:author" th:content="${seo.authorUrl}">
    <script th:if="${seo.structuredData != null}" type="application/ld+json" th:utext="${seo.structuredData}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<svg th:fragment="heartIcon" class="stat-icon heart-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
</svg>
<svg th:fragment="eyeIcon" class="stat-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
</svg>
<header th:fragment="header"><a class="skip" href="#main">Skip to content</a>
    <div class="shell nav"><a class="brand" href="/" th:text="${name}">Your Name</a>
        <nav aria-label="Main navigation"><a href="/" th:classappend="${page == 'home'} ? 'active'"
                                             th:attr="aria-current=${page == 'home' ? 'page' : null}">Home</a><a
                href="/blog" th:classappend="${page == 'blog'} ? 'active'"
                th:attr="aria-current=${page == 'blog' ? 'page' : null}">Writing</a><a href="/books"
                                                                                       th:classappend="${page == 'books'} ? 'active'"
                                                                                       th:attr="aria-current=${page == 'books' ? 'page' : null}">Bookshelf</a><a
                href="/#about">About</a></nav>
        <button th:replace="~{fragments :: themeToggle}"></button>
    </div>
</header>
<button th:fragment="themeToggle" class="theme-toggle" type="button" data-theme-toggle
        aria-label="Switch to dark mode" hidden>
    <svg class="theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/>
    </svg>
    <svg class="theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <span data-theme-label>Dark</span>
</button>
<nav th:fragment="socialLinks" class="social-links" aria-label="My social profiles">
    <a class="action-link" href="https://x.com/pratikc_89" target="_blank" rel="noopener noreferrer">X <span aria-hidden="true">↗</span></a>
    <a class="action-link" href="https://github.com/pratikgchaudhari" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    <a class="action-link" href="https://www.linkedin.com/in/pratik-chaudhari-71ba37a1/" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
</nav>
<footer th:fragment="footer" class="shell">
    <span>© <span th:text="${#dates.year(#dates.createNow())}"></span> <span th:text="${name}"></span></span>
    <div th:if="${page != 'home'}" class="footer-social">
        <span class="link-label">Social profiles</span>
        <nav th:replace="~{fragments :: socialLinks}"></nav>
    </div>
</footer>
<nav th:fragment="pagination(position)" th:if="${totalPages > 1}"
     class="pagination" th:classappend="${'pagination-' + position}"
     th:id="${position == 'top' ? 'articles' : 'articles-bottom'}"
     th:attr="aria-label=${'Article pagination — ' + position}">
    <a th:if="${currentPage > 1}" class="pagination-link" rel="prev"
       th:href="${currentPage == 2} ? @{/blog#articles} : @{/blog#articles(page=${currentPage - 1})}">
        <span aria-hidden="true">←</span> Previous
    </a>
    <span th:unless="${currentPage > 1}" class="pagination-link is-disabled" aria-disabled="true">
        <span aria-hidden="true">←</span> Previous
    </span>
    <span class="pagination-status" aria-current="page" th:text="${'Page ' + currentPage + ' of ' + totalPages}"></span>
    <a th:if="${currentPage < totalPages}" class="pagination-link" rel="next"
       th:href="@{/blog#articles(page=${currentPage + 1})}">
        Next <span aria-hidden="true">→</span>
    </a>
    <span th:unless="${currentPage < totalPages}" class="pagination-link is-disabled" aria-disabled="true">
        Next <span aria-hidden="true">→</span>
    </span>
</nav>
<div th:fragment="posts" class="post-list"><p th:if="${posts.isEmpty()}" class="empty">No articles yet.</p><a class="post-row" th:each="post : ${posts}" th:href="@{/blog/{slug}(slug=${post.slug})}">
    <div class="post-date">
        <time th:datetime="${post.date}" th:text="${post.displayDate()}"></time>
        <span th:text="${post.minutes + ' min read'}"></span></div>
    <div><span class="tag" th:text="${post.tag}"></span>
        <h3 th:text="${post.title}"></h3>
        <p th:text="${post.summary}"></p>
        <div class="post-stats" th:with="stats=${articleStats[post.slug]}">
            <span><svg th:replace="~{fragments :: eyeIcon}"></svg><span th:text="${stats.views + (stats.views == 1 ? ' view' : ' views')}"></span></span>
            <span><svg th:replace="~{fragments :: heartIcon}"></svg><span th:text="${stats.likes + (stats.likes == 1 ? ' like' : ' likes')}"></span></span>
        </div></div>
    <span class="arrow" aria-hidden="true">↗</span></a></div>
</body>
</html>
