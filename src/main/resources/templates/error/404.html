<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script src="/theme.js"></script>
    <title>Page not found</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell error-appearance"><button th:replace="~{fragments :: themeToggle}"></button></div>
<main class="shell page-heading">
    <p class="eyebrow">404</p>
    <h1>Page not <em>found.</em></h1>
    <p class="intro">There’s no page at this address. Let’s get you back to the homepage.</p>
    <a class="text-link" href="/">Back home <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
