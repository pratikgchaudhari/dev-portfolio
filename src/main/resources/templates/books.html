<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="main" class="shell bookshelf">
    <section class="page-heading">
        <h1>My <em>bookshelf.</em></h1>
        <p class="intro">What I’m reading now, and what I’ve read along the way.</p>
    </section>
    <section class="reading-now" aria-labelledby="reading-title">
        <div class="section-head">
            <h2 id="reading-title">Currently reading<span class="accent">.</span></h2>
            <span class="count"
                  th:text="${shelf.currentlyReading.size() + (shelf.currentlyReading.size() == 1 ? ' book' : ' books')}"></span>
        </div>
        <p class="empty" th:if="${shelf.currentlyReading.isEmpty()}">Nothing in progress right now.</p>
        <ul class="current-books">
            <li th:each="book : ${shelf.currentlyReading}">
                <a class="current-book" th:href="${book.url}" target="_blank" rel="noopener noreferrer">
                    <h3 th:text="${book.title}"></h3>
                    <span class="book-visit">View book <span aria-hidden="true">↗</span></span>
                </a>
            </li>
        </ul>
    </section>
    <section class="finished-books" aria-labelledby="finished-title">
        <div class="section-head">
            <h2 id="finished-title">Already read<span class="accent">.</span></h2>
            <span class="count"
                  th:text="${shelf.finished.size() + (shelf.finished.size() == 1 ? ' book' : ' books')}"></span>
        </div>
        <p class="empty" th:if="${shelf.finished.isEmpty()}">No finished books yet.</p>
        <ol class="book-grid">
            <li th:each="book, item : ${shelf.finished}">
                <a class="book-entry" th:href="${book.url}" target="_blank" rel="noopener noreferrer">
                    <span class="book-number" aria-hidden="true"
                          th:text="${#numbers.formatInteger(item.count, 2)}"></span>
                    <h3 th:text="${book.title}"></h3>
                    <span class="book-card-footer"><span>View book</span><span class="book-arrow"
                                                                               aria-hidden="true">↗</span></span>
                </a>
            </li>
        </ol>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
