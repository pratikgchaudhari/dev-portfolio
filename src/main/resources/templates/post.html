<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${post.title + ' — ' + name}, ${post.summary})}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="main" class="article-shell"><a class="back" href="/blog">← All writing</a>
    <article>
        <header class="article-heading"><p class="eyebrow" th:text="${post.tag}"></p>
            <h1 th:text="${post.title}"></h1>
            <p class="intro" th:text="${post.summary}"></p>
            <div class="byline"><span th:text="${name}"></span><span aria-hidden="true">/</span>
                <time th:datetime="${post.date}" th:text="${post.displayDate()}"></time>
                <span th:text="${post.minutes + ' min read'}"></span></div>
        </header>
        <div class="prose" th:utext="${post.html}"></div>
    </article>
    <div class="article-end"><a class="text-link" href="/blog">More articles →</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
