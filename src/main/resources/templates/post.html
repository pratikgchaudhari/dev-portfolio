<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="main" class="article-shell"><a class="back" href="/blog">← All writing</a>
    <article>
        <header class="article-heading"><p class="eyebrow" th:text="${post.tag}"></p>
            <h1 th:text="${post.title}"></h1>
            <p class="intro" th:text="${post.summary}"></p>
            <div class="byline"><a href="/#about" rel="author" th:text="${name}"></a><span aria-hidden="true">/</span>
                <time th:datetime="${post.date}" th:text="${post.displayDate()}"></time>
                <span th:text="${post.minutes + ' min read'}"></span></div>
            <div class="article-engagement" data-article-engagement th:attr="data-api=@{/api/articles/{slug}(slug=${post.slug})}">
                <button class="heart-button" type="button" disabled
                        th:attr="aria-pressed=${stats.liked},aria-label=${stats.liked ? 'Unlike this article' : 'Like this article'}">
                    <span class="heart-reaction" aria-hidden="true">
                        <svg th:replace="~{fragments :: heartIcon}"></svg>
                    </span>
                    <span data-like-count th:text="${stats.likes + (stats.likes == 1 ? ' like' : ' likes')}"></span>
                </button>
                <span class="view-count"><svg th:replace="~{fragments :: eyeIcon}"></svg>
                    <span data-view-count th:text="${stats.views + (stats.views == 1 ? ' view' : ' views')}"></span>
                </span>
                <span class="share-count" title="Successful link copies using the Share button">
                    <svg th:replace="~{fragments :: shareIcon}"></svg>
                    <span data-share-count th:text="${stats.shares + (stats.shares == 1 ? ' share' : ' shares')}"></span>
                </span>
                <button class="share-button" type="button" data-share-article hidden
                        th:attr="data-share-url=${seo.canonicalUrl != null ? seo.canonicalUrl : '/blog/' + post.slug}"
                        aria-describedby="article-share-help" title="Copy article link">
                    <span class="share-glyph" aria-hidden="true">
                        <svg class="share-link-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                            <path d="m10 13 4-4m-6 6-1 1a4.2 4.2 0 0 1-6-6l4-4a4.2 4.2 0 0 1 6 0m2 2 1-1a4.2 4.2 0 0 1 6 6l-4 4a4.2 4.2 0 0 1-6 0" transform="translate(1 2)"/>
                        </svg>
                        <svg class="share-check-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                            <path d="m5 12 4 4L19 6"/>
                        </svg>
                    </span>
                    <span data-share-label>Share</span>
                </button>
                <span class="visually-hidden" id="article-share-help">Copy this article’s link to your clipboard.</span>
                <span class="visually-hidden" role="status" aria-live="polite" data-share-status></span>
                <p class="engagement-message" role="status" aria-live="polite" data-engagement-message></p>
                <p class="engagement-message" role="status" aria-live="polite" data-share-count-message></p>
                <div class="share-fallback" data-share-fallback hidden>
                    <label for="article-share-url">Copy the link below:</label>
                    <input id="article-share-url" type="text" readonly data-share-input spellcheck="false">
                </div>
                <noscript><p class="engagement-message">Enable JavaScript to like this article.</p></noscript>
            </div>
        </header>
        <div class="prose" th:utext="${post.html}"></div>
    </article>
    <section class="related-articles" th:if="${!relatedPosts.isEmpty()}" aria-labelledby="also-see-heading">
        <h2 id="also-see-heading">Also see<span class="accent">.</span></h2>
        <ul class="related-list">
            <li th:each="related : ${relatedPosts}">
                <a class="related-link" th:href="@{/blog/{slug}(slug=${related.slug})}">
                    <div class="related-copy">
                        <div class="related-meta"><span class="tag" th:text="${related.tag}"></span>
                            <span th:text="${related.minutes + ' min read'}"></span></div>
                        <h3 th:text="${related.title}"></h3>
                        <p th:text="${related.summary}"></p>
                    </div>
                    <span class="related-arrow" aria-hidden="true">→</span>
                </a>
            </li>
        </ul>
    </section>
    <div class="article-end"><a class="text-link" href="/blog">More articles →</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script src="/engagement.js" defer></script>
<script src="/share.js" defer></script>
</body>
</html>
