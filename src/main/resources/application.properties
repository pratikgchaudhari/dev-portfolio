spring.application.name=portfolio
portfolio.name=Pratik Chaudhari
portfolio.role=Senior Software Engineer
portfolio.bio=I work across backend systems and the web. This is a home for my work, writing, and reading.
# Override for another production domain; use INDEXING_ENABLED=false on previews.
portfolio.site-url=${SITE_URL:https://notnullpratik.dev}
portfolio.indexing-enabled=${INDEXING_ENABLED:true}
portfolio.content-dir=${CONTENT_DIR:content/posts}
portfolio.posts-per-page=${POSTS_PER_PAGE:6}
spring.datasource.url=jdbc:h2:file:${ENGAGEMENT_DB:./data/engagement};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=sa
spring.datasource.password=${ENGAGEMENT_DB_PASSWORD:}
spring.sql.init.mode=always
server.error.include-message=never
server.error.include-stacktrace=never
portfolio.books-file=${BOOKS_FILE:content/books.json}
server.port=8080
server.address=127.0.0.1
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
