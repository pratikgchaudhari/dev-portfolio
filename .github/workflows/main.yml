name: Dev Portfolio Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Rename JAR
        run: cp target/*.jar app.jar

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: app.jar
          target: /opt/notnullpratik-releases
          overwrite: true

      - name: Swap and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd /opt/notnullpratik
            cp -a app.jar app.jar.prev 2>/dev/null || true
            install -o springapp -g springapp -m 644 /opt/notnullpratik-releases/app.jar /opt/notnullpratik/app.jar
            sudo systemctl restart notnullpratik
            sleep 5
            systemctl is-active --quiet springapp
